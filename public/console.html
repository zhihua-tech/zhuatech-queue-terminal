<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华排队叫号运营中心</title><link rel="stylesheet" href="/styles.css"></head><body><div class="layout"><aside class="side"><div class="logo">ZHUATECH QUEUE<small>上海如静知华信息科技有限公司</small></div><div class="nav"><div class="on">实时运营</div><div>网点管理</div><div>业务与队列</div><div>窗口坐席</div><div>终端设备</div><div>服务评价</div><div>审计报表</div></div></aside><main class="main"><header class="head"><div><h1>排队叫号运营中心</h1><div class="sub">知华便民服务中心 · 今日实时数据</div></div><div class="live">● 数据实时更新</div></header><section class="metrics" id="metrics"></section><section class="cols"><div class="panel"><h2>当前等候队列</h2><div class="queue" id="queue"></div></div><div class="panel"><h2>窗口状态</h2><table><thead><tr><th>窗口</th><th>坐席</th><th>状态</th><th>当前票号</th></tr></thead><tbody id="windows"></tbody></table></div></section></main></div><script>fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const L={waiting:'等候人数',serving:'办理中',completed:'已办结',noShow:'过号',openWindows:'开放窗口',avgWaitMinutes:'平均等候(分)'};metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="metric"><span>${L[k]}</span><b>${v}</b></div>`).join('');queue.innerHTML=d.waiting.map(x=>`<div class="ticket"><strong>${x.number}</strong><small>${d.services.find(s=>s.id===x.serviceId)?.name||''}</small><span class="badge">${{care:'关爱',appointment:'预约',normal:'普通'}[x.priority]}</span></div>`).join('')||'<div class="sub">暂无等候</div>';windows.innerHTML=d.windows.map(w=>`<tr><td>${w.number}号 · ${w.name}</td><td>${w.operator||'未登录'}</td><td>${w.status}</td><td>${d.recentCalls.find(t=>t.id===w.currentTicketId)?.number||'-'}</td></tr>`).join('')});</script></body></html>
