<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华叫号信息屏</title><link rel="stylesheet" href="/styles.css"></head><body class="display"><header class="display-head"><h1>知华便民服务中心</h1><div class="display-clock" id="clock"></div></header><main class="display-main"><section id="calls"></section><aside class="waiting"><h2>等候信息</h2><div id="wait"></div></aside></main><div class="notice">请留意语音提示并提前准备材料 · 关爱窗口可向现场工作人员咨询 · www.zhuatech.cn</div><script>const tick=()=>clock.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{calls.innerHTML=(d.recentCalls.length?d.recentCalls:[{number:'A008',windowId:d.windows[0]?.id}]).slice(0,3).map(t=>`<div class="call-card" style="margin-bottom:18px"><div><label>请 ${t.number}</label><div class="num">${t.number}</div></div><div><label>前往窗口</label><div class="window">${d.windows.find(w=>w.id===t.windowId)?.number||'01'}</div></div></div>`).join('');wait.innerHTML=d.waiting.slice(0,6).map(x=>`<div class="waiting-row"><b>${x.number}</b><span>前方等候</span></div>`).join('')||'<div class="sub">当前无需等候</div>'});</script></body></html>
